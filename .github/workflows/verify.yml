name: Verify app
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'database/**'
      - 'server.py'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hitch-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database and API
        run: python3 -m unittest discover -s tests -v
      - name: Verify trip form, dates, and account isolation
        run: node --test tests/*.cjs
