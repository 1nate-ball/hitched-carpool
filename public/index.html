<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hitch Carpool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app column centered on a quiet stage; sticky top bars, sticky bottom nav. Navy "highway sign" ink + red-rock accent. */
:root{
  --stage:#E3E8EF; --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6;
  --ink:#13203A; --muted:#5A6479; --line:#D9DFE8;
  --accent:#C8502A; --accent-soft:#FBE7DE;
  --btn:#13203A; --btn-ink:#FFFFFF;
  --ok:#1D7148; --ok-bg:#DFF2E7; --warn:#8A5A06; --warn-bg:#FBEFD3; --bad:#A8271F; --bad-bg:#FBE3E0;
  --shadow:0 1px 2px rgba(19,32,58,.06),0 6px 20px rgba(19,32,58,.07);
  --scrim:rgba(10,16,30,.5);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#080C14; --bg:#0E1420; --surface:#161F31; --surface-2:#1C2740;
  --ink:#E7ECF4; --muted:#9AA5B9; --line:#27324A;
  --accent:#F08A5D; --accent-soft:#3A2219;
  --btn:#E7ECF4; --btn-ink:#0E1420;
  --ok:#6FD39C; --ok-bg:#163326; --warn:#F2C164; --warn-bg:#3A2D10; --bad:#F59088; --bad-bg:#3D1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#080C14; --bg:#0E1420; --surface:#161F31; --surface-2:#1C2740;
  --ink:#E7ECF4; --muted:#9AA5B9; --line:#27324A;
  --accent:#F08A5D; --accent-soft:#3A2219;
  --btn:#E7ECF4; --btn-ink:#0E1420;
  --ok:#6FD39C; --ok-bg:#163326; --warn:#F2C164; --warn-bg:#3A2D10; --bad:#F59088; --bad-bg:#3D1A18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.2rem}
h3{font-size:1.02rem}
p{margin:0}
.stage{min-height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:460px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:500px){.app{border-inline:1px solid var(--line);box-shadow:var(--shadow)}}
.screen{flex:1;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.topbar .title{flex:1;min-width:0}
.topbar .title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1}
.brand-sub{font-size:.78rem;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-weight:600;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.input,input[type=text],input[type=password],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
textarea{min-height:90px;resize:vertical}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .filebox{border-color:var(--bad)}
.err{font-size:.8rem;color:var(--bad);font-weight:500}
.err:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fieldset{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.fieldset > .eyebrow{margin-bottom:-4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.filebox{border:1px dashed var(--line);border-radius:11px;padding:12px;display:flex;align-items:center;gap:12px;background:var(--surface-2)}
.filebox input{font-size:.85rem;min-width:0;flex:1}
.filebox .thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.reqs li::before{content:"○ "}
.reqs li.ok{color:var(--ok)}
.reqs li.ok::before{content:"✓ "}
.choice{display:grid;gap:10px}
.choice label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.choice input{margin-top:3px;accent-color:var(--accent)}
.choice label:has(input:checked){border-color:var(--ink);background:var(--surface-2)}

/* alerts, pills */
.alert{border-radius:12px;padding:12px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.info{background:var(--surface-2);color:var(--ink)}
.alert b{font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.verified{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font-size:.78rem;font-weight:700}
.verified svg{width:14px;height:14px}

/* auth */
.auth{padding:28px 20px 32px;display:flex;flex-direction:column;gap:22px;flex:1}
.auth-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.92rem;color:var(--muted)}
.demo-note{font-size:.82rem;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:14px}
.auth-hero{border-radius:18px;overflow:hidden;aspect-ratio:16/7;max-width:100%}
.auth-hero svg{width:100%;height:100%;display:block}

/* home */
.searchcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.sfield{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.sfield svg{width:18px;height:18px;flex:none;color:var(--muted)}
.sfield input{border:0;background:transparent;min-height:44px;padding:0;flex:1;min-width:0}
.sfield input:focus{outline:none}
.sfield:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.sfield .tag{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:34px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.dcard:hover{border-color:var(--muted)}
.dart{aspect-ratio:16/11;max-width:100%;background:var(--surface-2);position:relative}
.dart svg{position:absolute;inset:0;width:100%;height:100%}
.dart .count{position:absolute;left:8px;top:8px}
.dbody{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dbody h3{font-size:.98rem;line-height:1.2}
.dmeta{font-size:.8rem;color:var(--muted)}
.dprice{font-size:.85rem;font-weight:700}
.dprice span{font-weight:500;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:.88rem}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
.banner .link{color:inherit;font-size:.82rem}

/* trips */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters select{width:auto;min-height:38px;padding:6px 10px;border-radius:999px;font-weight:600;font-size:.88rem}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-weight:600;font-size:.88rem;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;width:100%}
.tcard:hover{border-color:var(--muted)}
.ttop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.twhen{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.tprice{text-align:right;flex:none}
.tprice b{font-family:var(--f-display);font-size:1.15rem}
.tprice div{font-size:.75rem;color:var(--muted)}
.driver{display:flex;align-items:center;gap:10px;min-width:0}
.driver .nm{font-weight:600}
.route{display:grid;grid-template-columns:14px 1fr;gap:2px 10px;font-size:.88rem}
.route .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-top:5px}
.route .dot.end{background:var(--accent);border-color:var(--accent)}
.route .line{width:2px;background:var(--line);margin:0 auto;height:12px}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:.85rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{width:40px;height:40px;color:var(--muted)}

.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden;font-family:var(--f-body)}
.av img{width:100%;height:100%;object-fit:cover}
.avstack{display:flex}
.avstack .av{border:2px solid var(--surface);margin-left:-8px}
.avstack .av:first-child{margin-left:0}

/* detail */
.hero{position:relative;aspect-ratio:16/8;max-width:100%;overflow:hidden;border-radius:var(--r)}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,rgba(10,16,30,.7));color:#fff}
.hero .cap h1{font-size:1.6rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0}
.actionbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;z-index:4}
.actionbar .p{flex:none}
.actionbar .p b{font-family:var(--f-display);font-size:1.25rem}
.actionbar .p div{font-size:.75rem;color:var(--muted)}
.actionbar .btn{flex:1}

/* my trips */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;min-height:38px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.mtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.demo{font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.demo .link{font-size:.78rem;color:var(--muted)}

/* manage */
.rq{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rq .note{font-size:.88rem;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.plist{display:flex;flex-direction:column;gap:10px}
.plist .driver{padding:10px 0;border-top:1px solid var(--line)}
.plist .driver:first-child{border-top:0;padding-top:0}

/* chat */
.chatwrap{display:flex;flex-direction:column;flex:1;min-height:0}
.pin{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:.86rem;display:flex;gap:10px;align-items:center}
.pin svg{width:18px;height:18px;color:var(--accent);flex:none}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 11px;min-width:0;overflow-wrap:anywhere}
.msg .who{font-size:.74rem;color:var(--muted);margin-bottom:2px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);border-radius:14px 14px 4px 14px}
.msg.me .who{color:inherit;opacity:.7;text-align:right}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.composer form{flex-direction:row;flex:1;gap:8px}
.composer input{flex:1;min-width:0;border-radius:999px}
.composer .btn{border-radius:999px}

/* profile */
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:6px}
.avpick{display:flex;gap:10px;flex-wrap:wrap}
.avpick button{border:2px solid transparent;border-radius:50%;padding:2px;background:none;cursor:pointer}
.avpick button[aria-pressed="true"]{border-color:var(--accent)}
.privacy{display:flex;gap:10px;font-size:.85rem;color:var(--muted);align-items:flex-start}
.privacy svg{width:18px;height:18px;flex:none;margin-top:1px}

/* nav */
.nav{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;border-radius:10px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:500px){.scrim{align-items:center}.sheet{border-radius:20px;max-width:420px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="stage"><div class="app" id="app"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
// ---------- helpers ----------
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW = new Date(2026, 9, 3, 10, 0); // prototype "today"
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parse(dt){ const [d,t='00:00'] = dt.split('T'); const [y,m,da] = d.split('-').map(Number); const [h,mi] = t.split(':').map(Number); return new Date(y,m-1,da,h,mi); }
const fDate = dt => { const d = parse(dt); return `${DAYS[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fTimeD = d => { let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; };
const fTime = dt => fTimeD(parse(dt));
const fDT = dt => `${fDate(dt)} · ${fTime(dt)}`;
const money = n => '$' + n;

const I = {

function art(kind){
  const P = {
    city:  ['#8FB7DE','#F3D2A6','#7F95B3','#5C6F8E','#2E3D5A'],
    snow:  ['#9CC1E8','#EAF2FB','#6C82A0','#4D6280','#2F4A3A'],

    lake:  ['#93CCE6','#E8F5F9','#7FA88A','#56806A','#3B93BA'],
  }[kind];
  const [s1,s2,m1,m2,g] = P;
  let fg = '';
  if (kind === 'city') fg = `<polygon points="0,140 60,95 120,125 190,80 260,120 330,90 400,125 400,200 0,200" fill="${m1}"/>
    <g fill="${g}"><rect x="40" y="130" width="26" height="70"/><rect x="72" y="110" width="22" height="90"/><rect x="100" y="140" width="30" height="60"/><rect x="138" y="96" width="20" height="104"/><rect x="164" y="122" width="34" height="78"/><rect x="206" y="104" width="24" height="96"/><rect x="236" y="135" width="40" height="65"/><rect x="284" y="118" width="22" height="82"/><rect x="312" y="140" width="48" height="60"/></g>
    <rect x="0" y="186" width="400" height="14" fill="${m2}"/>`;
  if (kind === 'snow') fg = `<polygon points="0,150 80,60 150,130 220,45 300,120 360,70 400,105 400,200 0,200" fill="${m1}"/>
    <polygon points="80,60 100,82 90,80 80,90 70,82 62,80" fill="#fff"/><polygon points="220,45 244,72 232,70 220,80 208,72 196,74" fill="#fff"/><polygon points="360,70 378,90 368,88 358,96 348,88" fill="#fff"/>
    <polygon points="0,170 120,125 240,160 400,130 400,200 0,200" fill="${m2}"/>
    <g fill="${g}"><polygon points="30,200 42,160 54,200"/><polygon points="58,200 68,170 78,200"/><polygon points="320,200 334,155 348,200"/><polygon points="350,200 360,172 370,200"/></g>`;
  if (kind === 'redrock') fg = `<rect x="0" y="150" width="400" height="50" fill="${g}"/>
    <path d="M30 150 V105 h18 l6 -8 h40 l6 8 h14 V150 Z" fill="${m1}"/><path d="M230 150 V85 h20 l4 -6 h50 l4 6 h22 V150 Z" fill="${m1}"/>
    <rect x="160" y="96" width="14" height="54" fill="${m2}"/><rect x="157" y="90" width="20" height="8" rx="2" fill="${m2}"/>
    <polygon points="0,200 0,175 140,165 260,180 400,168 400,200" fill="${m2}"/>`;
  if (kind === 'desert') fg = `<polygon points="0,150 90,110 170,140 260,100 340,135 400,115 400,200 0,200" fill="${m1}"/>
    <polygon points="0,200 0,170 120,150 220,172 320,155 400,170 400,200" fill="${m2}"/>
    <rect x="0" y="188" width="400" height="12" fill="${g}"/>`;
  if (kind === 'lake') fg = `<polygon points="0,130 70,95 150,120 230,85 310,115 400,95 400,200 0,200" fill="${m1}"/>
    <polygon points="0,145 100,125 200,140 300,122 400,140 400,200 0,200" fill="${m2}"/>

  const id = 'g' + Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient></defs><rect width="400" height="200" fill="url(#${id})"/><circle cx="320" cy="55" r="22" fill="#FFF6E0" opacity=".9"/>${fg}</svg>`;
}

function av(u, size=36){
  const style = `width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px;background:${u.color}`;
  const inner = u.photo ? `<img src="${u.photo}" alt="">` : esc(u.first[0] + u.last[0]);
  return `<span class="av" style="${style}" aria-hidden="true">${inner}</span>`;

// ---------- navigation ----------
function go(screen, params={}, push=true){
  if (push && S.screen !== 'login') S.hist.push({screen:S.screen, params:S.params});
  S.screen = screen; S.params = params; render(); window.scrollTo(0,0);
}
function back(){ const h = S.hist.pop(); if (h){ S.screen = h.screen; S.params = h.params; render(); window.scrollTo(0,0);} else go('home',{},false); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }

const NAVMAP = {home:'home', results:'home', detail:'home', mytrips:'mytrips', manage:'mytrips', post:'post', profile:'profile', edit:'profile'};
function nav(){
  const cur = NAVMAP[S.screen];
  const b = (id, icon, label) => `<button data-act="nav" data-to="${id}" ${cur===id?'aria-current="page"':''}>${icon}${label}</button>`;
  return `<nav class="nav" aria-label="Main">${b('home',I.compass,'Explore')}${b('mytrips',I.ticket,'My Trips')}${b('post',I.plus,'Post a trip')}${b('profile',I.user,'Profile')}</nav>`;
}

function openRequestDialog(){
  const t = TRIPS.find(x => x.id === S.params.id), d = D(t.dest), u = U(t.driver);
  const wrap = document.createElement('div');
  wrap.className = 'scrim';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rq-h">
    <h2 id="rq-h">Would you like to request a seat for this trip?</h2>
    <dl class="kv tnum" style="margin:0"><dt>To</dt><dd>${esc(d.name)}</dd><dt>Leaves</dt><dd>${fDT(t.depart)}</dd><dt>Pickup</dt><dd>${esc(t.pickup)}</dd><dt>Return</dt><dd>${t.ret ? fDT(t.ret) : 'One-way. You arrange your own ride back.'}</dd><dt>Price</dt><dd><b>${money(t.price)}</b> per seat, ${t.ret?'round trip':'one way'}</dd></dl>
    <div class="alert info small">Your seat isn't reserved until ${esc(u.first)} accepts. We'll let you know as soon as they decide.</div>
    <div class="row"><button class="btn" data-x="no">Keep browsing</button><button class="btn accent" data-x="yes">Confirm request</button></div>
    <p class="small muted" id="rq-timer" style="text-align:center"></p>
  </div>`;
  document.body.appendChild(wrap);
  let secs = 60; const timerEl = wrap.querySelector('#rq-timer');
  const tick = () => { timerEl.textContent = `This prompt closes in 0:${String(secs).padStart(2,'0')}`; };
  tick();
  const iv = setInterval(() => { secs--; if (secs <= 0){ close(); toast('Request timed out. No request was sent.'); } else tick(); }, 1000);
  function close(){ clearInterval(iv); wrap.remove(); }
  wrap.addEventListener('click', e => {
    const x = e.target.closest('[data-x]')?.dataset.x;
    if (e.target === wrap || x === 'no'){ close(); }
    if (x === 'yes'){ close(); t.requests = t.requests.filter(r => r.uid !== 'me'); t.requests.push({uid:'me', status:'pending', note:''}); S.tripsTab = 'rider'; go('mytrips'); toast(`Request sent to ${u.first}`); }

}

BIND.post = () => {

  const $ = id => document.getElementById(id);
  const covers = () => { $('pt-covers').textContent = $('pt-ret').checked ? 'Your price per seat covers both directions: there and back.' : 'Your price per seat covers one direction only. Riders will see that this is a one-way trip and arrange their own ride back.'; };
  $('pt-ret').addEventListener('change', () => { $('pt-retfields').hidden = !$('pt-ret').checked; covers(); });
  covers();
  f.addEventListener('submit', e => {
    e.preventDefault();
    const v = id => $(id).value.trim(), err = {}, ret = $('pt-ret').checked;
    if (!v('pt-dest')) err.dest = 'Choose a destination.';
    if (!v('pt-date')) err.date = 'Pick a departure date.';
    if (!v('pt-time')) err.time = 'Pick a departure time.';
    const dep = v('pt-date') && v('pt-time') ? `${v('pt-date')}T${v('pt-time')}` : null;
    if (dep && parse(dep) <= NOW) err.date = 'Departure must be in the future.';
    if (!v('pt-pickup')) err.pickup = 'Add a pickup location.';
    if (!v('pt-dropoff')) err.dropoff = 'Add a drop-off location.';
    const seats = +v('pt-seats'), price = +v('pt-price');
    if (!v('pt-seats')) err.seats = 'Enter how many seats are open.'; else if (!Number.isInteger(seats) || seats < 1 || seats > 7) err.seats = 'Seats must be a whole number from 1 to 7.';
    if (!v('pt-price')) err.price = 'Enter a price per seat.'; else if (!Number.isInteger(price) || price < 1 || price > 150) err.price = 'Price must be a whole dollar amount from $1 to $150.';
    let rt = null;
    if (ret){
      if (!v('pt-rdate')) err.rdate = 'Pick a return date.';
      if (!v('pt-rtime')) err.rtime = 'Pick a return time.';
      if (v('pt-rdate') && v('pt-rtime')){ rt = `${v('pt-rdate')}T${v('pt-rtime')}`; if (dep && parse(rt) <= parse(dep)) err.rdate = 'Return must be after departure.'; }
    }
    ['dest','date','time','pickup','dropoff','seats','price','rdate','rtime'].forEach(k => { const el = $('pe-'+k); if (el){ el.textContent = err[k] || ''; el.closest('.field').classList.toggle('invalid', !!err[k]); } });

BIND.chat = () => {
  const f = document.getElementById('chatForm'); if (!f) return;
  const t = TRIPS.find(x => x.id === S.params.id), inp = document.getElementById('c-in'), btn = document.getElementById('c-send'), box = document.getElementById('msgs');
  box.scrollTop = box.scrollHeight; window.scrollTo(0, document.body.scrollHeight);
  inp.addEventListener('input', () => btn.disabled = !inp.value.trim());
  f.addEventListener('submit', e => {
    e.preventDefault(); const text = inp.value.trim(); if (!text) return;
    const n = new Date();
    CHATS[t.id].push({uid:'me', at:`${MON[n.getMonth()]} ${n.getDate()} · ${fTimeD(n)}`, text});
    inp.value = ''; btn.disabled = true; box.innerHTML = msgsHTML(t); box.scrollTop = box.scrollHeight; window.scrollTo(0, document.body.scrollHeight); inp.focus();
  });
};

/* Screen 10: Profile / edit profile */
SCREENS.profile = () => {
  const m = S.me;
  return `<header class="topbar"><div class="title"><h2>Profile</h2></div><span class="pill">Demo account</span></header>
<div class="screen">
  ${pendingBanner()}
  <div class="phead">${av(m,96)}<h1>${esc(fullName(m))}</h1>${m.verified === 'verified' ? `<span class="pill ok">${I.check.replace('<svg','<svg width="14" height="14"')}ID verified</span>` : '<span class="pill warn">Verification pending</span>'}</div>
  <div class="card"><dl class="kv" style="margin:0"><dt>Hometown</dt><dd>${m.hometown ? esc(m.hometown) : '<span class="muted">Not added yet</span>'}</dd><dt>Bio</dt><dd>${m.bio ? esc(m.bio) : '<span class="muted">Not added yet</span>'}</dd></dl></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn block" data-act="go" data-to="edit">Edit profile</button>
    <button class="btn accent block" data-act="nav" data-to="post" ${isVerified()?'':'disabled'}>Post a trip</button>
    <button class="btn primary block" data-act="mymanage">Manage my trip</button>
    ${isVerified() ? '' : '<p class="small muted" style="text-align:center">Posting a trip unlocks once your ID is verified.</p>'}
  </div>
  <div class="privacy">${I.lock}<span>Demo profile: no student ID or date of birth is collected in this version.</span></div>
</div>${nav()}`;
};
const SAMPLE_COLORS = ['#2F6B5E','#3B6EA8','#B0562F','#7B4FA0','#A8456B','#4F6B2E'];
SCREENS.edit = () => {
  const m = S.me;
  return `${topbar('Edit profile')}
<div class="screen">
<form id="edForm" novalidate>
  <div class="fieldset"><div class="eyebrow">Photo</div>
    <div class="avpick" role="group" aria-label="Sample avatars">${SAMPLE_COLORS.map(c => `<button type="button" data-c="${c}" aria-label="Avatar color ${c}" aria-pressed="${!m.photo && m.color===c}">${av({...m, photo:null, color:c},48)}</button>`).join('')}</div>
    <p class="small muted">Prototype uses sample avatars.</p>
  </div>
  <div class="fieldset"><div class="eyebrow">Public info</div>
    <div class="field"><label for="ed-name">Name</label><input id="ed-name" type="text" value="${esc(fullName(m))}" readonly><div class="hint">This classroom demo uses Jordan Hale's sample account.</div></div>
    <div class="field"><label for="ed-home">Hometown</label><input id="ed-home" type="text" maxlength="100" value="${esc(m.hometown)}" placeholder="e.g. Boise, ID"></div>
    <div class="field"><label for="ed-bio">Short bio</label><textarea id="ed-bio" maxlength="160" placeholder="Major, where you usually travel, what you're like on a road trip">${esc(m.bio)}</textarea><div class="hint" id="ed-count"></div></div>
  </div>
  <div class="privacy">${I.lock}<span>Hometown and bio are public profile fields in the planned app.</span></div>
  <div class="row"><button type="button" class="btn" data-act="back">Cancel</button><button type="submit" class="btn primary">Save changes</button></div>
</form>
</div>${nav()}`;
};
BIND.edit = () => {
  let color = S.me.color, photoCleared = false;
  const bio = document.getElementById('ed-bio'), cnt = document.getElementById('ed-count');
  const c = () => cnt.textContent = `${bio.value.length} / 160`; bio.addEventListener('input', c); c();
  document.querySelectorAll('.avpick button').forEach(b => b.addEventListener('click', () => { color = b.dataset.c; photoCleared = true; document.querySelectorAll('.avpick button').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
  document.getElementById('edForm').addEventListener('submit', async e => {
    e.preventDefault();
    const button = e.target.querySelector('[type="submit"]');
    button.disabled = true; button.textContent = 'Saving…';
    try {
      const response = await fetch('/api/profile', {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({hometown:document.getElementById('ed-home').value.trim(), bio:bio.value.trim(), color})
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Save failed');
      S.me = result; S.hist.pop(); S.screen = 'profile'; S.params = {};
      render(); toast('Profile saved to database');
    } catch (error) {
      toast(error.message); button.disabled = false; button.textContent = 'Save changes';
    }
  });
};

// ---------- render + events ----------
async function boot(){
  try {
    const response = await fetch('/api/profile', {cache:'no-store'});
    if (!response.ok) throw new Error('Backend unavailable');
    S.me = await response.json(); S.screen = 'profile'; render();
  } catch (error) {
    app.innerHTML = '<div class="screen"><h1>Cannot connect to the database</h1><p>Start python3 server.py and open http://127.0.0.1:8000. Reload to retry.</p></div>';
  }
}
function render(){
  document.querySelectorAll('.scrim').forEach(x => x.remove());
  app.innerHTML = '<div class="banner small" role="status">Classroom demo · Profile saving uses a real database. Rides, verification, and chat are prototype interactions.</div>' + SCREENS[S.screen]();
  BIND[S.screen]?.();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'go': go(el.dataset.to, {}, !['login','signup','forgot'].includes(S.screen)); break;
    case 'back': back(); break;
    case 'nav': S.hist = []; if (el.dataset.to === 'home'){ S.miss = null; } go(el.dataset.to, {}, false); break;
    case 'cat': S.cat = el.dataset.c; render(); break;
    case 'dest': S.miss = null; S.filters = {max:'', round:false}; go('results', {dest:id}); break;
    case 'change': S.hist = []; go('home', {}, false); setTimeout(() => document.getElementById('s-dest')?.focus(), 0); break;
    case 'clearf': S.filters = {max:'', round:false}; render(); break;
    case 'trip': go('detail', {id}); break;
    case 'request': openRequestDialog(); break;
    case 'tab': S.tripsTab = el.dataset.t; render(); break;
    case 'withdraw': { const t = TRIPS.find(x => x.id === id); t.requests = t.requests.filter(r => r.uid !== 'me'); render(); toast('Request withdrawn'); break; }
    case 'manage': go('manage', {id, demo: !!el.dataset.demo}); break;
    case 'chat': go('chat', {id}); break;
    case 'decide': {
      const t = TRIPS.find(x => x.id === S.params.id), r = t.requests.find(x => x.uid === el.dataset.uid), u = U(r.uid);
      if (el.dataset.v === 'accepted'){ if (!seatsLeft(t)) return; t.passengers.push(r.uid); t.requests = t.requests.filter(x => x !== r); toast(`${u.first} is confirmed and added to the group chat`); }
      else { r.status = 'declined'; if (r.uid !== 'me') t.requests = t.requests.filter(x => x !== r); toast(`Declined ${u.first}'s request`); }
      render(); break;
    }
    case 'mymanage': { const mine = TRIPS.filter(t => t.driver === 'me'); if (mine.length === 1) go('manage', {id:mine[0].id}); else { S.tripsTab = 'driver'; S.hist = []; go('mytrips', {}, false); } break; }
    case 'approve': S.me.verified = 'verified'; render(); toast('ID verified. You can now request seats and post trips.'); break;
    case 'signout': toast('Classroom demo uses the fixed Jordan Hale account.'); break;
    case 'unused-signout': S.me = null; S.hist = []; S.loginNotice = 'You\'ve been signed out.'; S.search = {dest:'',from:'',date:''}; S.cat = 'All'; S.screen = 'login'; render(); break;
  }
});
boot();

</script>
